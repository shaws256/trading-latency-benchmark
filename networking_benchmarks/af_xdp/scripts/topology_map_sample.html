<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>AF_XDP Latency Topology Map</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #e6edf3; overflow: hidden; }
.container { width: 100vw; height: 100vh; position: relative; }

/* Edges — lowest layer */
svg.edges { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

/* Edge labels — above edges, below nodes */
.edge-label {
  position: absolute; z-index: 5;
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 13px; font-weight: 700;
  background: rgba(13, 17, 23, 0.94);
  padding: 2px 7px; border-radius: 4px;
  border: 1px solid rgba(255,255,255,0.1);
  white-space: nowrap;
  cursor: default;
  transform: translate(-50%, -50%);
  transition: border-color 0.15s, background 0.15s;
}
.edge-label:hover {
  border-color: rgba(88,166,255,0.5);
  background: rgba(22, 27, 34, 0.98);
}

/* Nodes — foreground, OPAQUE bodies */
.node {
  position: absolute; z-index: 20;
  border-radius: 50%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  border: 2.5px solid rgba(255,255,255,0.25);
  box-shadow: 0 4px 24px rgba(0,0,0,0.6);
}
.node .instance-type { font-size: 11px; font-weight: 700; color: #fff; white-space: nowrap; }
.node .ec2-name { font-size: 9px; color: #79c0ff; white-space: nowrap; margin-top: 1px; }
.node .ip { font-size: 9px; color: #b1bac4; font-family: 'SF Mono', monospace; }
.node .specs { font-size: 8px; color: #8b949e; margin-top: 2px; white-space: nowrap; }
.node .eni-badge {
  position: absolute; top: -5px; right: -5px;
  background: #f0883e; color: #fff;
  font-size: 9px; font-weight: 700;
  min-width: 20px; height: 20px; padding: 0 4px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid #0d1117;
}

/* Node hover tooltip */
.node-tooltip {
  position: absolute; z-index: 100;
  background: rgba(22, 27, 34, 0.97);
  border: 1px solid #30363d;
  border-radius: 8px; padding: 12px 14px;
  font-size: 11px; pointer-events: none;
  backdrop-filter: blur(8px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  white-space: nowrap;
  opacity: 0; transition: opacity 0.15s;
  min-width: 260px;
}
.node-tooltip.visible { opacity: 1; }
.node-tooltip h4 { font-size: 12px; color: #58a6ff; margin-bottom: 6px; }
.node-tooltip table { border-collapse: collapse; width: 100%; }
.node-tooltip th {
  text-align: left; font-size: 10px; color: #8b949e;
  padding: 2px 6px 2px 0; border-bottom: 1px solid #21262d;
}
.node-tooltip td {
  text-align: right; font-family: 'SF Mono', monospace;
  font-size: 11px; padding: 3px 4px; color: #e6edf3;
}
.node-tooltip td.peer-name { text-align: left; color: #79c0ff; font-family: inherit; }
.node-tooltip td.highlight { color: #f0883e; font-weight: 600; }
.node-tooltip .direction { font-size: 9px; color: #6e7681; }

/* Edge hover tooltip */
.edge-tooltip {
  position: absolute; z-index: 100;
  background: rgba(22, 27, 34, 0.97);
  border: 1px solid #30363d;
  border-radius: 8px; padding: 12px 14px;
  font-size: 11px; pointer-events: none;
  backdrop-filter: blur(8px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  white-space: nowrap;
  opacity: 0; transition: opacity 0.15s;
  min-width: 240px;
}
.edge-tooltip.visible { opacity: 1; }
.edge-tooltip h4 { font-size: 12px; color: #58a6ff; margin-bottom: 8px; }
.edge-tooltip .dir-block { margin-bottom: 8px; }
.edge-tooltip .dir-label { font-size: 10px; color: #8b949e; margin-bottom: 3px; }
.edge-tooltip .dir-values { display: grid; grid-template-columns: repeat(6, auto); gap: 2px 10px; }
.edge-tooltip .metric-label { font-size: 9px; color: #6e7681; }
.edge-tooltip .metric-val { font-family: 'SF Mono', monospace; font-size: 12px; color: #e6edf3; }
.edge-tooltip .metric-val.highlight { color: #f0883e; font-weight: 700; }
.edge-tooltip .asymmetry { font-size: 10px; color: #f0883e; margin-top: 4px; padding-top: 4px; border-top: 1px solid #21262d; }

/* Edge highlight on node hover */
svg.edges line.edge-line { transition: opacity 0.15s, stroke-width 0.15s; }
svg.edges line.edge-line.dimmed { opacity: 0.12 !important; }
svg.edges line.edge-line.highlighted { opacity: 1 !important; stroke-width: 6px !important; filter: drop-shadow(0 0 4px currentColor); }

/* Topology contours */
.contour {
  position: absolute; z-index: 0;
  border-radius: 24px; border: 1.5px dashed;
  pointer-events: none;
}
.contour .label {
  position: absolute; top: -10px; left: 16px;
  font-size: 10px; font-weight: 600;
  padding: 1px 8px; border-radius: 4px; white-space: nowrap;
}
.contour.region { border-color: rgba(88,166,255,0.25); }
.contour.region .label { background: rgba(88,166,255,0.15); color: #58a6ff; }
.contour.az { border-color: rgba(163,113,247,0.25); }
.contour.az .label { background: rgba(163,113,247,0.15); color: #a371f7; }
.contour.vpc { border-color: rgba(57,211,83,0.2); }
.contour.vpc .label { background: rgba(57,211,83,0.12); color: #39d353; }
.contour.cpg { border-color: rgba(240,136,62,0.3); }
.contour.cpg .label { background: rgba(240,136,62,0.15); color: #f0883e; }

/* Instance type legend panel */
.instance-legend {
  position: fixed; bottom: 20px; left: 20px; z-index: 1000;
  background: rgba(22, 27, 34, 0.96); border: 1px solid #30363d;
  border-radius: 8px; padding: 16px 18px; font-size: 12px;
  backdrop-filter: blur(8px); max-width: 360px;
}
.instance-legend h3 { font-size: 13px; margin-bottom: 10px; color: #58a6ff; }
.instance-legend .type-row {
  display: flex; align-items: center; gap: 12px;
  margin: 6px 0; padding: 5px 0;
  border-bottom: 1px solid rgba(48,54,61,0.5);
}
.instance-legend .type-row:last-child { border-bottom: none; }
.instance-legend .type-dot { border-radius: 50%; flex-shrink: 0; }
.instance-legend .type-info { flex: 1; }
.instance-legend .type-name { font-weight: 600; color: #e6edf3; font-size: 12px; }
.instance-legend .type-specs { font-size: 11px; color: #8b949e; }
.instance-legend a {
  color: #58a6ff; text-decoration: none; font-size: 11px;
  border: 1px solid rgba(88,166,255,0.3); border-radius: 3px;
  padding: 2px 6px; white-space: nowrap;
}
.instance-legend a:hover { background: rgba(88,166,255,0.15); }

/* Visual legend */
.vis-legend {
  position: fixed; top: 20px; right: 20px; z-index: 1000;
  background: rgba(22, 27, 34, 0.96); border: 1px solid #30363d;
  border-radius: 8px; padding: 16px 18px; font-size: 12px;
  backdrop-filter: blur(8px);
}
.vis-legend h3 { font-size: 13px; margin-bottom: 10px; color: #58a6ff; }
.vis-legend .row { display: flex; align-items: center; gap: 10px; margin: 5px 0; }
.vis-legend .swatch { width: 32px; height: 5px; border-radius: 2px; }
.vis-legend .contour-samples { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px; }
.vis-legend .contour-samples span {
  border-radius: 4px; padding: 2px 8px; font-size: 11px;
}

/* Stats panel — LEFT side */
.stats {
  position: fixed; top: 20px; left: 20px; z-index: 1000;
  background: rgba(22, 27, 34, 0.96); border: 1px solid #30363d;
  border-radius: 8px; padding: 18px; font-size: 13px;
  backdrop-filter: blur(8px); min-width: 220px;
}
.stats h3 { font-size: 14px; margin-bottom: 10px; color: #58a6ff; }
.stats .stat { display: flex; justify-content: space-between; margin: 3px 0; }
.stats .stat .val { color: #f0883e; font-weight: 600; font-family: 'SF Mono', monospace; font-size: 13px; }
.stats .stress { margin-top: 8px; padding-top: 8px; border-top: 1px solid #30363d; font-size: 11px; color: #8b949e; }
.stats .stress .val { color: #39d353; }
</style>
</head><body>
<div class="container" id="container">
  <svg class="edges" id="edges"></svg>
  <div class="stats" id="stats"></div>
</div>

<script>
// ─── Fleet data (injected by generate_matrix_report.py) ─────────────────────
const fleet = {
  region: "us-east-1",
  az: "us-east-1a",
  vpc_id: "vpc-0a1b2c3d4e5f",
  cpg_name: "CPG-X7K9",
  nodes: [
    { index: 0, ec2_name: "Trading-Node-0",  type: "c7i.4xlarge",  private_ip: "10.0.1.42",  enis: 8,  bw_gbps: 25,   pps_mpps: 5,   nitro_gen: 5, vcpus: 16, mem_gb: 32,  metal: false },
    { index: 1, ec2_name: "Trading-Node-1",  type: "c7i.4xlarge",  private_ip: "10.0.1.87",  enis: 8,  bw_gbps: 25,   pps_mpps: 5,   nitro_gen: 5, vcpus: 16, mem_gb: 32,  metal: false },
    { index: 2, ec2_name: "Trading-Node-2",  type: "c6in.4xlarge", private_ip: "10.0.1.103", enis: 8,  bw_gbps: 50,   pps_mpps: 10,  nitro_gen: 4, vcpus: 16, mem_gb: 32,  metal: false },
    { index: 3, ec2_name: "Trading-Node-3",  type: "c6in.4xlarge", private_ip: "10.0.1.215", enis: 8,  bw_gbps: 50,   pps_mpps: 10,  nitro_gen: 4, vcpus: 16, mem_gb: 32,  metal: false },
    { index: 4, ec2_name: "Trading-Probe-0", type: "c7i.xlarge",   private_ip: "10.0.1.33",  enis: 4,  bw_gbps: 12.5, pps_mpps: 2,   nitro_gen: 5, vcpus: 4,  mem_gb: 8,   metal: false },
  ],
  matrix: [
    [null, {p50:30,p90:34,p99:37,p999:45,max:120,loss:0}, {p50:36,p90:40,p99:44,p999:55,max:200,loss:0}, {p50:38,p90:43,p99:47,p999:58,max:180,loss:0}, {p50:32,p90:36,p99:39,p999:48,max:150,loss:0}],
    [{p50:30,p90:34,p99:37,p999:46,max:130,loss:0}, null, {p50:35,p90:39,p99:43,p999:54,max:190,loss:0}, {p50:37,p90:41,p99:45,p999:57,max:170,loss:0}, {p50:33,p90:37,p99:40,p999:49,max:160,loss:0}],
    [{p50:36,p90:40,p99:44,p999:56,max:210,loss:0}, {p50:35,p90:39,p99:43,p999:53,max:195,loss:0}, null, {p50:31,p90:35,p99:38,p999:47,max:140,loss:0}, {p50:37,p90:41,p99:45,p999:56,max:185,loss:0}],
    [{p50:38,p90:43,p99:47,p999:59,max:220,loss:0}, {p50:37,p90:42,p99:45,p999:57,max:175,loss:0}, {p50:32,p90:36,p99:39,p999:48,max:145,loss:0}, null, {p50:39,p90:44,p99:48,p999:60,max:230,loss:0}],
    [{p50:32,p90:36,p99:39,p999:49,max:155,loss:0}, {p50:33,p90:37,p99:40,p999:50,max:165,loss:0}, {p50:37,p90:41,p99:45,p999:57,max:190,loss:0}, {p50:39,p90:44,p99:48,p999:61,max:235,loss:0}, null],
  ]
};

const W = window.innerWidth;
const H = window.innerHeight;
const N = fleet.nodes.length;
const CX = W / 2;
const CY = H / 2;

// ─── Node sizing ─────────────────────────────────────────────────────────────
function computeNodeScore(node) {
  let s = 0;
  s += node.metal ? 40 : 0;
  s += (node.bw_gbps / 200) * 25;
  s += (node.pps_mpps / 30) * 20;
  s += (node.enis / 15) * 10;
  s += (node.nitro_gen / 6) * 15;
  s += (node.vcpus / 192) * 8;
  s += (node.mem_gb / 768) * 2;
  return s;
}
function nodeRadius(node) { return 30 + computeNodeScore(node) * 0.6; }

// ─── Opaque node colors by family ────────────────────────────────────────────
const familyColors = {
  'c7i':  { bg: '#1a2a40', border: '#58a6ff' },
  'c6in': { bg: '#261a3d', border: '#a371f7' },
  'c6i':  { bg: '#1a2e1a', border: '#39d353' },
  'm7i':  { bg: '#2e2415', border: '#f0883e' },
  'r7i':  { bg: '#2e1515', border: '#da3633' },
};
function getNodeColors(type) {
  const family = type.split('.')[0];
  return familyColors[family] || { bg: '#1a2a40', border: '#58a6ff' };
}

// ─── SMACOF MDS positioning ──────────────────────────────────────────────────
function computePositions() {
  const SCALE = 7.5;
  
  // Build symmetric target distance matrix
  const D = Array.from({length: N}, () => Array(N).fill(0));
  for (let i = 0; i < N; i++)
    for (let j = 0; j < N; j++)
      if (i !== j) {
        const ab = fleet.matrix[i][j]?.p50 || 35;
        const ba = fleet.matrix[j][i]?.p50 || 35;
        D[i][j] = ((ab + ba) / 2) * SCALE;
      }

  // Initialize on a circle
  let pos = fleet.nodes.map((_, i) => ({
    x: CX + 120 * Math.cos(2 * Math.PI * i / N - Math.PI/2),
    y: CY + 120 * Math.sin(2 * Math.PI * i / N - Math.PI/2),
  }));

  // SMACOF iterations
  for (let iter = 0; iter < 800; iter++) {
    const newPos = pos.map(() => ({x: 0, y: 0}));
    for (let i = 0; i < N; i++) {
      let wx = 0, wy = 0, wsum = 0;
      for (let j = 0; j < N; j++) {
        if (i === j) continue;
        const dx = pos[i].x - pos[j].x;
        const dy = pos[i].y - pos[j].y;
        const dist = Math.sqrt(dx*dx + dy*dy) || 0.001;
        const target = D[i][j];
        const w = 1.0 / (target * target); // stress-weighted
        wx += w * (pos[j].x + target * (dx / dist));
        wy += w * (pos[j].y + target * (dy / dist));
        wsum += w;
      }
      newPos[i].x = wx / wsum;
      newPos[i].y = wy / wsum;
    }
    pos = newPos;
  }

  // Center and fit viewport
  const PAD = 180;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const p of pos) { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y); }
  const rangeX = maxX - minX || 1;
  const rangeY = maxY - minY || 1;
  const scale = Math.min((W - 2*PAD) / rangeX, (H - 2*PAD) / rangeY);
  
  const result = pos.map(p => ({
    x: CX + (p.x - (minX + rangeX/2)) * scale,
    y: CY + (p.y - (minY + rangeY/2)) * scale,
  }));

  // Compute normalized stress (quality metric)
  let stressNum = 0, stressDen = 0;
  for (let i = 0; i < N; i++)
    for (let j = i+1; j < N; j++) {
      const dx = result[i].x - result[j].x;
      const dy = result[i].y - result[j].y;
      const dij = Math.sqrt(dx*dx + dy*dy);
      const target = D[i][j] * scale;
      stressNum += (dij - target) ** 2;
      stressDen += target ** 2;
    }
  const stress = Math.sqrt(stressNum / stressDen);

  return { positions: result, stress };
}

const { positions, stress } = computePositions();

// ─── Edge color & width ──────────────────────────────────────────────────────
let allP50 = [], allP99 = [];
for (let i = 0; i < N; i++)
  for (let j = 0; j < N; j++)
    if (fleet.matrix[i][j]) { allP50.push(fleet.matrix[i][j].p50); allP99.push(fleet.matrix[i][j].p99); }
const minP50 = Math.min(...allP50), maxP50 = Math.max(...allP50);
const minP99 = Math.min(...allP99), maxP99 = Math.max(...allP99);

function latencyColor(p50) {
  const t = (maxP50 === minP50) ? 0.5 : (p50 - minP50) / (maxP50 - minP50);
  if (t <= 0.5) {
    const s = t * 2;
    return `rgb(${Math.round(35 + 205*s)}, ${Math.round(134 + 20*s)}, ${Math.round(54*(1-s))})`;
  } else {
    const s = (t - 0.5) * 2;
    return `rgb(${Math.round(240 - 22*s)}, ${Math.round(154*(1-s))}, ${Math.round(51*s)})`;
  }
}
function edgeWidth(p99) {
  const t = (maxP99 === minP99) ? 0.5 : (p99 - minP99) / (maxP99 - minP99);
  return 2 + t * 4;
}

// ─── Render contours ─────────────────────────────────────────────────────────
(function renderContours() {
  const container = document.getElementById('container');
  const maxR = Math.max(...fleet.nodes.map(n => nodeRadius(n)));
  const allX = positions.map(p => p.x), allY = positions.map(p => p.y);
  const bounds = {
    left: Math.min(...allX) - maxR - 24, right: Math.max(...allX) + maxR + 24,
    top: Math.min(...allY) - maxR - 24, bottom: Math.max(...allY) + maxR + 24,
  };
  [{cls:'region', label:`Region: ${fleet.region}`, pad:60},
   {cls:'az',     label:`AZ: ${fleet.az}`,         pad:44},
   {cls:'vpc',    label:`VPC: ${fleet.vpc_id}`,    pad:28},
   {cls:'cpg',    label:`CPG: ${fleet.cpg_name}`,  pad:12},
  ].forEach(c => {
    const el = document.createElement('div');
    el.className = `contour ${c.cls}`;
    el.style.left = `${bounds.left - c.pad}px`; el.style.top = `${bounds.top - c.pad}px`;
    el.style.width = `${bounds.right - bounds.left + 2*c.pad}px`;
    el.style.height = `${bounds.bottom - bounds.top + 2*c.pad}px`;
    el.innerHTML = `<span class="label">${c.label}</span>`;
    container.appendChild(el);
  });
})();

// ─── Render edges (with hover hit-areas and highlight support) ───────────────
const edgeElements = []; // [{line, hitArea, i, j, avgP50, ab, ba}]
(function renderEdges() {
  const svgEl = document.getElementById('edges');
  for (let i = 0; i < N; i++)
    for (let j = i + 1; j < N; j++) {
      const ab = fleet.matrix[i][j], ba = fleet.matrix[j][i];
      if (!ab && !ba) continue;
      const avgP50 = Math.round(((ab?.p50||0) + (ba?.p50||0)) / 2);
      const avgP99 = ((ab?.p99||0) + (ba?.p99||0)) / 2;

      // Visible line
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', positions[i].x); line.setAttribute('y1', positions[i].y);
      line.setAttribute('x2', positions[j].x); line.setAttribute('y2', positions[j].y);
      line.setAttribute('stroke', latencyColor(avgP50));
      line.setAttribute('stroke-width', edgeWidth(avgP99));
      line.setAttribute('opacity', '0.55');
      line.setAttribute('data-i', i); line.setAttribute('data-j', j);
      line.classList.add('edge-line');
      svgEl.appendChild(line);

      edgeElements.push({line, i, j, avgP50, ab, ba});
    }
})();

// ─── Edge hover tooltip ──────────────────────────────────────────────────────
const edgeTooltip = document.createElement('div');
edgeTooltip.className = 'edge-tooltip';
document.getElementById('container').appendChild(edgeTooltip);

// Edge tooltip is triggered from latency label boxes, not the edge lines themselves.
// We build the tooltip content generator as a reusable function.
function showEdgeTooltip(i, j) {
  const ab = fleet.matrix[i][j], ba = fleet.matrix[j][i];
  const nodeA = fleet.nodes[i], nodeB = fleet.nodes[j];
  const diff = ab && ba ? Math.abs(ab.p50 - ba.p50) : 0;
  const diffPct = ab && ba && Math.min(ab.p50, ba.p50) > 0 ? ((diff / Math.min(ab.p50, ba.p50)) * 100).toFixed(1) : '0';

  let html = `<h4>${nodeA.ec2_name} ↔ ${nodeB.ec2_name}</h4>`;
  if (ab) {
    html += `<div class="dir-block"><div class="dir-label">→ ${nodeA.ec2_name} → ${nodeB.ec2_name}</div>`;
    html += `<div class="dir-values">
      <span class="metric-label">p50</span><span class="metric-label">p90</span><span class="metric-label">p99</span><span class="metric-label">p99.9</span><span class="metric-label">max</span><span class="metric-label">loss</span>
      <span class="metric-val highlight">${ab.p50}</span><span class="metric-val">${ab.p90||'—'}</span><span class="metric-val">${ab.p99}</span><span class="metric-val">${ab.p999||'—'}</span><span class="metric-val">${ab.max||'—'}</span><span class="metric-val">${ab.loss !== undefined ? ab.loss+'%' : '—'}</span>
    </div></div>`;
  }
  if (ba) {
    html += `<div class="dir-block"><div class="dir-label">← ${nodeB.ec2_name} → ${nodeA.ec2_name}</div>`;
    html += `<div class="dir-values">
      <span class="metric-label">p50</span><span class="metric-label">p90</span><span class="metric-label">p99</span><span class="metric-label">p99.9</span><span class="metric-label">max</span><span class="metric-label">loss</span>
      <span class="metric-val highlight">${ba.p50}</span><span class="metric-val">${ba.p90||'—'}</span><span class="metric-val">${ba.p99}</span><span class="metric-val">${ba.p999||'—'}</span><span class="metric-val">${ba.max||'—'}</span><span class="metric-val">${ba.loss !== undefined ? ba.loss+'%' : '—'}</span>
    </div></div>`;
  }
  if (diff > 0) {
    html += `<div class="asymmetry">Asymmetry: Δ${diff}μs (${diffPct}%)</div>`;
  }
  edgeTooltip.innerHTML = html;
  edgeTooltip.classList.add('visible');
}

function positionEdgeTooltip(e) {
  let tx = e.clientX + 16, ty = e.clientY - 10;
  const tw = edgeTooltip.offsetWidth || 260;
  const th = edgeTooltip.offsetHeight || 150;
  if (tx + tw > W - 20) tx = e.clientX - tw - 16;
  if (ty + th > H - 20) ty = H - th - 20;
  if (ty < 10) ty = 10;
  edgeTooltip.style.left = `${tx}px`;
  edgeTooltip.style.top = `${ty}px`;
}

function hideEdgeTooltip() {
  edgeTooltip.classList.remove('visible');
}

// ─── Render edge labels (hover triggers edge tooltip) ─────────────────────────
(function renderEdgeLabels() {
  const container = document.getElementById('container');
  const placed = [];
  for (let i = 0; i < N; i++)
    for (let j = i + 1; j < N; j++) {
      const ab = fleet.matrix[i][j], ba = fleet.matrix[j][i];
      if (!ab && !ba) continue;
      const avgP50 = Math.round(((ab?.p50||0) + (ba?.p50||0)) / 2);
      const x1 = positions[i].x, y1 = positions[i].y;
      const x2 = positions[j].x, y2 = positions[j].y;
      const mx = (x1+x2)/2, my = (y1+y2)/2;
      const dx = x2-x1, dy = y2-y1;
      const len = Math.sqrt(dx*dx + dy*dy) || 1;
      // Perpendicular offset (18px away from line)
      let lx = mx + (-dy/len) * 18;
      let ly = my + ( dx/len) * 18;
      // Collision avoidance
      for (const p of placed) {
        if (Math.sqrt((lx-p.x)**2 + (ly-p.y)**2) < 32) {
          lx += (-dy/len) * 14; ly += (dx/len) * 14;
        }
      }
      placed.push({x: lx, y: ly});
      const el = document.createElement('div');
      el.className = 'edge-label';
      el.style.left = `${lx}px`; el.style.top = `${ly}px`;
      el.style.color = latencyColor(avgP50);
      el.textContent = `${avgP50} μs`;

      // Hover on latency box → show edge tooltip
      const ci = i, cj = j; // capture
      el.addEventListener('mouseenter', () => showEdgeTooltip(ci, cj));
      el.addEventListener('mousemove', positionEdgeTooltip);
      el.addEventListener('mouseleave', hideEdgeTooltip);

      container.appendChild(el);
    }
})();

// ─── Render nodes (foreground, opaque) + hover tooltips ──────────────────────
const tooltip = document.createElement('div');
tooltip.className = 'node-tooltip';
document.getElementById('container').appendChild(tooltip);

fleet.nodes.forEach((node, i) => {
  const container = document.getElementById('container');
  const r = nodeRadius(node);
  const colors = getNodeColors(node.type);
  const el = document.createElement('div');
  el.className = 'node';
  el.style.width = el.style.height = `${r*2}px`;
  el.style.left = `${positions[i].x - r}px`;
  el.style.top = `${positions[i].y - r}px`;
  el.style.background = colors.bg;
  el.style.borderColor = colors.border;
  el.innerHTML = `
    <span class="instance-type">${node.type}</span>
    <span class="ec2-name">${node.ec2_name}</span>
    <span class="ip">${node.private_ip}</span>
    <span class="specs">${node.bw_gbps}G · ${node.pps_mpps}Mpps · N${node.nitro_gen}</span>
    <span class="eni-badge">${node.enis}</span>
  `;
  container.appendChild(el);

  // Tooltip on hover + edge highlighting
  el.addEventListener('mouseenter', (e) => {
    // Highlight connected edges, dim others
    edgeElements.forEach(({line, i: ei, j: ej}) => {
      if (ei === i || ej === i) {
        line.classList.add('highlighted');
        line.classList.remove('dimmed');
      } else {
        line.classList.add('dimmed');
        line.classList.remove('highlighted');
      }
    });

    let html = `<h4>${node.ec2_name} → peers</h4>`;
    html += `<table><tr><th>Peer</th><th>p50</th><th>p90</th><th>p99</th><th>p99.9</th><th>max</th><th>loss</th></tr>`;
    for (let j = 0; j < N; j++) {
      if (i === j) continue;
      const peer = fleet.nodes[j];
      const data = fleet.matrix[i][j];
      if (!data) continue;
      html += `<tr>
        <td class="peer-name">${peer.ec2_name}</td>
        <td class="highlight">${data.p50}</td>
        <td>${data.p90 || '—'}</td>
        <td>${data.p99}</td>
        <td>${data.p999 || '—'}</td>
        <td>${data.max || '—'}</td>
        <td>${data.loss !== undefined ? data.loss + '%' : '—'}</td>
      </tr>`;
    }
    html += `</table>`;
    html += `<div class="direction" style="margin-top:6px">← Inbound (peers → this node):</div>`;
    html += `<table><tr><th>From</th><th>p50</th><th>p90</th><th>p99</th><th>p99.9</th><th>max</th><th>loss</th></tr>`;
    for (let j = 0; j < N; j++) {
      if (i === j) continue;
      const peer = fleet.nodes[j];
      const data = fleet.matrix[j][i];
      if (!data) continue;
      html += `<tr>
        <td class="peer-name">${peer.ec2_name}</td>
        <td class="highlight">${data.p50}</td>
        <td>${data.p90 || '—'}</td>
        <td>${data.p99}</td>
        <td>${data.p999 || '—'}</td>
        <td>${data.max || '—'}</td>
        <td>${data.loss !== undefined ? data.loss + '%' : '—'}</td>
      </tr>`;
    }
    html += `</table>`;
    tooltip.innerHTML = html;
    tooltip.classList.add('visible');
  });

  el.addEventListener('mousemove', (e) => {
    // Position tooltip to the right of cursor, flip if near edge
    let tx = e.clientX + 16;
    let ty = e.clientY - 10;
    const tw = tooltip.offsetWidth || 280;
    const th = tooltip.offsetHeight || 200;
    if (tx + tw > W - 20) tx = e.clientX - tw - 16;
    if (ty + th > H - 20) ty = H - th - 20;
    if (ty < 10) ty = 10;
    tooltip.style.left = `${tx}px`;
    tooltip.style.top = `${ty}px`;
  });

  el.addEventListener('mouseleave', () => {
    tooltip.classList.remove('visible');
    // Restore all edges
    edgeElements.forEach(({line}) => {
      line.classList.remove('highlighted', 'dimmed');
    });
  });
});

// ─── Instance type legend with specs links ───────────────────────────────────
(function renderInstanceLegend() {
  const container = document.getElementById('container');
  const seen = new Map();
  fleet.nodes.forEach(n => {
    if (!seen.has(n.type)) seen.set(n.type, n);
  });

  let rows = '';
  for (const [type, node] of seen) {
    const colors = getNodeColors(type);
    const r = Math.round(nodeRadius(node) * 0.35);
    const family = type.split('.')[0];
    // AWS specs URL
    const specUrl = `https://instances.vantage.sh/?selected=${type}&region=${fleet.region}`;
    const awsUrl = `https://aws.amazon.com/ec2/instance-types/${family}/`;
    rows += `
      <div class="type-row">
        <div class="type-dot" style="width:${r*2}px;height:${r*2}px;background:${colors.bg};border:2px solid ${colors.border}"></div>
        <div class="type-info">
          <div class="type-name">${type}</div>
          <div class="type-specs">${node.vcpus}vCPU · ${node.mem_gb}GB · ${node.bw_gbps}Gbps · ${node.pps_mpps}Mpps · ${node.enis} ENIs · Nitro ${node.nitro_gen}</div>
        </div>
        <a href="${specUrl}" target="_blank">specs↗</a>
        <a href="${awsUrl}" target="_blank">family↗</a>
      </div>`;
  }

  const el = document.createElement('div');
  el.className = 'instance-legend';
  el.innerHTML = `<h3>Instance Types</h3>${rows}`;
  container.appendChild(el);
})();

// ─── Visual legend ───────────────────────────────────────────────────────────
(function renderVisLegend() {
  const container = document.getElementById('container');
  const el = document.createElement('div');
  el.className = 'vis-legend';
  el.innerHTML = `
    <h3>Visual Encoding</h3>
    <div class="row"><div class="swatch" style="background:linear-gradient(to right,#238636,#f09a3e,#da3633)"></div>
      <span>Edge color = p50 RTT (${minP50}μs → ${maxP50}μs)</span></div>
    <div class="row"><div class="swatch" style="background:#8b949e;height:2px"></div>
      <span>Edge width ∝ p99 (${minP99}–${maxP99}μs)</span></div>
    <div class="row"><span>Node size = f(BW, PPS, ENIs, Nitro, CPU, Mem, metal)</span></div>
    <div class="row"><span>Distance ∝ latency (SMACOF stress: ${(stress*100).toFixed(1)}%)</span></div>
    <div class="contour-samples">
      <span style="border:1.5px dashed rgba(240,136,62,0.4);color:#f0883e">CPG</span>
      <span style="border:1.5px dashed rgba(57,211,83,0.3);color:#39d353">VPC</span>
      <span style="border:1.5px dashed rgba(163,113,247,0.3);color:#a371f7">AZ</span>
      <span style="border:1.5px dashed rgba(88,166,255,0.3);color:#58a6ff">Region</span>
    </div>`;
  container.appendChild(el);
})();

// ─── Stats panel ─────────────────────────────────────────────────────────────
const statsEl = document.getElementById('stats');
const medP50 = [...allP50].sort((a,b)=>a-b)[Math.floor(allP50.length/2)];
const medP99 = [...allP99].sort((a,b)=>a-b)[Math.floor(allP99.length/2)];
statsEl.innerHTML = `
  <h3>Topology Summary</h3>
  <div class="stat"><span>Nodes</span><span class="val">${N}</span></div>
  <div class="stat"><span>Pairs</span><span class="val">${allP50.length}</span></div>
  <div class="stat"><span>p50 range</span><span class="val">${minP50}–${maxP50} μs</span></div>
  <div class="stat"><span>p99 range</span><span class="val">${minP99}–${maxP99} μs</span></div>
  <div class="stat"><span>Median p50</span><span class="val">${medP50} μs</span></div>
  <div class="stat"><span>Spread</span><span class="val">${maxP50-minP50} μs</span></div>
  <div style="margin-top:8px;border-top:1px solid #30363d;padding-top:6px">
    <div class="stat"><span>CPG</span><span class="val">${fleet.cpg_name}</span></div>
    <div class="stat"><span>AZ</span><span class="val">${fleet.az}</span></div>
    <div class="stat"><span>Region</span><span class="val">${fleet.region}</span></div>
  </div>
  <div class="stress">Layout fidelity (SMACOF): <span class="val">${(100 - stress*100).toFixed(1)}%</span> — stress ${(stress*100).toFixed(1)}%</div>
`;
</script>
</body></html>
