# Generate latency report from collected results.
#
# Runs the Python report generator on a local results directory.
# Results are expected to already be collected (by run_ucast.yaml).
#
# Usage:
#   ansible-playbook -i inventory.aws_ec2.yml report.yaml
#   ansible-playbook -i inventory.aws_ec2.yml report.yaml -e results_dir=./results/2026-07-28/18-43-32
#
# If results_dir is not specified, finds the most recent results subdirectory.

- name: Generate report
  hosts: localhost
  connection: local
  gather_facts: no

  vars:
    results_base: "{{ playbook_dir }}/results"

  tasks:

    - name: Find most recent results dir (if not specified)
      ansible.builtin.shell: |
        find {{ results_base }} -mindepth 2 -maxdepth 2 -type d | sort | tail -1
      register: latest_dir
      when: results_dir is not defined
      changed_when: false

    - name: Set results directory
      ansible.builtin.set_fact:
        results_dir: "{{ results_dir | default(latest_dir.stdout | trim) }}"

    - name: Verify results directory exists
      ansible.builtin.stat:
        path: "{{ results_dir }}"
      register: dir_check

    - name: Fail if no results found
      ansible.builtin.fail:
        msg: "No results directory found at {{ results_dir }}"
      when: not dir_check.stat.exists

    - name: List result files
      ansible.builtin.find:
        paths: "{{ results_dir }}"
        patterns: "*.json"
      register: result_files

    - name: Show result files found
      ansible.builtin.debug:
        msg: "Found {{ result_files.files | length }} JSON files in {{ results_dir }}"

    - name: Run report generator
      ansible.builtin.shell: |
        python3 {{ playbook_dir }}/report/generate_matrix_report.py {{ results_dir }}
      register: report_output
      ignore_errors: yes

    - name: Display report output
      ansible.builtin.debug:
        msg: "{{ report_output.stdout_lines | default(['No output']) }}"

    - name: Show errors (if any)
      ansible.builtin.debug:
        msg: "{{ report_output.stderr_lines }}"
      when: report_output.rc != 0

    - name: Summary
      ansible.builtin.debug:
        msg: >-
          Reports generated in {{ results_dir }}/:
          matrix_report.html (heatmap),
          topology_map.html (interactive map),
          matrix_summary.json (data export)
      when: report_output.rc == 0
