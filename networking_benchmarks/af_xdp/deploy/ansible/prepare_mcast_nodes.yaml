---
# Separate EC2 node-config playbook for the multicast benchmark.
#
# The baked AMI is tailored to the UNICAST/replicator use case: every node boots
# replicator.service (ucast mode) which binds AF_XDP queue 0. For the mcast
# fan-out benchmark the source and destination are pure sender/receiver and must
# NOT run the replicator — otherwise it holds the AF_XDP queue and mcast_send /
# mcast_receive fail with "xsk_socket__create: Device or resource busy". This
# playbook adapts the ucast-baked nodes for the mcast roles:
#
#   source, destination : stop + DISABLE replicator.service (frees the AF_XDP
#                         queue; disable so a reboot does not re-grab it) and
#                         detach any stale XDP program left on the NIC.
#   replicator          : left as-is — configure_mcast.yaml puts it in mcast mode.
#
# Run order for the multicast benchmark:
#   ansible-playbook -i inventory.aws_ec2.yml prepare_mcast_nodes.yaml
#   ansible-playbook -i inventory.aws_ec2.yml configure_mcast.yaml -e replicator_private_ip=<ip>
#   ansible-playbook -i inventory.aws_ec2.yml run_mcast.yaml       -e replicator_private_ip=<ip>

- name: Prepare source & destination for multicast (free the AF_XDP queue)
  hosts: source:destination
  become: yes
  gather_facts: no

  tasks:

    - name: Stop and disable replicator.service (pure mcast sender/receiver)
      ansible.builtin.systemd:
        name: replicator.service
        state: stopped
        enabled: false
      failed_when: false

    - name: Detach any stale XDP program from the primary NIC
      ansible.builtin.shell: |
        IFACE=$(ip -4 route show default | awk '{print $5}' | head -1)
        ip link set dev "$IFACE" xdp off 2>/dev/null || true
        ip link set dev "$IFACE" xdpgeneric off 2>/dev/null || true
      changed_when: false

    - name: Verify mcast binaries + XDP object are present
      ansible.builtin.shell: |
        test -x /opt/af-xdp/mcast_send \
          && test -x /opt/af-xdp/mcast_receive \
          && test -f /opt/af-xdp/xdp/mcast.o \
          && echo ok
      register: mcast_ready
      changed_when: false
      failed_when: "'ok' not in mcast_ready.stdout"

    - name: Report readiness
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} ({{ group_names | intersect(['source','destination']) | first }}): replicator stopped, XDP clear, mcast binaries present"

- name: Note replicator node role
  hosts: replicator
  become: no
  gather_facts: no

  tasks:
    - name: Replicator node keeps replicator.service
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: replicator node — replicator.service stays; configure_mcast.yaml sets mcast mode."
