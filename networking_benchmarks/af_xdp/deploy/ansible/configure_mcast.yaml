---
# Runtime provisioning playbook for AF_XDP benchmark fleet.
#
# Assumes instances are launched from a baked AMI (built by CDK ami-builder)
# which already contains: build deps, xdp-tools, benchmark binaries, PTP/chrony
# config, sysctl tuning, and systemd units.
#
# This playbook is self-contained: it adapts the ucast-baked nodes for their
# mcast roles AND wires the topology. The baked AMI runs replicator.service on
# every node (ucast mode) which holds AF_XDP queue 0, so mcast_send/mcast_receive
# would fail "Device or resource busy" — this playbook stops+disables it on the
# source and destination (pure sender/receiver) as the first step of each play:
#   source      — stop replicator (free AF_XDP queue); sends via mcast_send -D
#   replicator  — replicator systemd service in mcast mode
#   destination — stop replicator + multicast group registration + ARP seed
#   verify      — best-effort datapath probe (mcast_send m2u burst)
#
# Required variable (pass via --extra-vars or inventory host_vars):
#   replicator_private_ip — private IP of the replicator (m2u tunnel dst + control channel)
#
# Tunable vars (override via --extra-vars):
#   mcast_group       (default: 224.0.31.50)
#   base_mcast_group  (default: 224.0.31.50)
#   data_port         (default: 5000)
#
# Usage:
#   ansible-playbook -i inventory.aws_ec2.yml configure_mcast.yaml \
#       --extra-vars "replicator_private_ip=10.61.0.5"

# ── Play 1: Source — free AF_XDP queue (no kernel tunnel; mcast_send builds m2u) ──
- name: Prepare source (free AF_XDP queue; no kernel tunnel needed)
  hosts: source
  become: yes
  gather_facts: yes

  tasks:

    - name: Validate replicator_private_ip is provided
      ansible.builtin.assert:
        that:
          - replicator_private_ip is defined
          - replicator_private_ip | length > 0
        fail_msg: "replicator_private_ip must be provided via --extra-vars"

    - name: Free the AF_XDP queue — stop + disable replicator (source is a pure mcast sender)
      ansible.builtin.systemd:
        name: replicator.service
        state: stopped
        enabled: false
      failed_when: false

    - name: Detach any stale XDP program from the primary NIC
      ansible.builtin.shell: |
        IFACE=$(ip -4 route show default | awk '{print $5}' | head -1)
        ip link set dev "$IFACE" xdp off 2>/dev/null || true
        ip link set dev "$IFACE" xdpgeneric off 2>/dev/null || true
      changed_when: false

    # The light m2u tunnel needs no kernel GRE device: mcast_send builds a plain
    # unicast UDP frame (with the 8-byte m2u header) straight to the replicator
    # via AF_XDP, using -D <replicator_private_ip>.


# ── Play 2: Replicator — configure and start ──────────────────────────────────
- name: Start replicator on replicator
  hosts: replicator
  become: yes
  gather_facts: yes

  tasks:

    - name: Write replicator config (mcast mode)
      ansible.builtin.copy:
        dest: /etc/default/replicator
        content: |
          REPLICATOR_MODE=mcast
          REPLICATOR_PORT={{ data_port | default(5000) }}
          REPLICATOR_MCAST_GROUP={{ mcast_group | default('224.0.31.50') }}

    - name: Restart replicator service
      ansible.builtin.systemd:
        name: replicator.service
        state: restarted
        daemon_reload: yes

    - name: Wait for AF_XDP initialisation
      ansible.builtin.pause:
        seconds: 5

    - name: Verify replicator is running
      ansible.builtin.command: systemctl is-active replicator.service
      register: pr_active
      changed_when: false
      failed_when: pr_active.stdout != 'active'


# ── Play 3: Destinations — multicast group registration ────────────────────────
- name: Register destinations with replicator
  hosts: destination
  become: true
  gather_facts: false

  tasks:

    - name: Skip when replicator_private_ip is not defined
      ansible.builtin.meta: end_play
      when: replicator_private_ip is not defined

    - name: Free the AF_XDP queue — stop + disable replicator (destination uses mcast_receive)
      ansible.builtin.systemd:
        name: replicator.service
        state: stopped
        enabled: false
      failed_when: false

    - name: Detach any stale XDP program from the primary NIC
      ansible.builtin.shell: |
        IFACE=$(ip -4 route show default | awk '{print $5}' | head -1)
        ip link set dev "$IFACE" xdp off 2>/dev/null || true
        ip link set dev "$IFACE" xdpgeneric off 2>/dev/null || true
      changed_when: false

    - name: Compute per-destination multicast group
      ansible.builtin.set_fact:
        mcast_group: >-
          {{ (base_mcast_group | default('224.0.31.50')).split('.')[:-1] | join('.') }}.{{
             (base_mcast_group | default('224.0.31.50')).split('.')[-1] | int +
             groups['destination'].index(inventory_hostname) | int }}

    - name: Join multicast group via replicator control channel
      ansible.builtin.shell: >
        /opt/af-xdp/replicator_ctl {{ replicator_private_ip }} mcast {{ mcast_group }}
      register: join_result
      failed_when: join_result.rc != 0

    - name: Seed ARP toward the replicator (so the replicator learns this
            destination's MAC for the AF_XDP fan-out; otherwise fan-out frames
            get a broadcast dst MAC and are dropped by ENA)
      ansible.builtin.shell: ping -c 3 -W 1 {{ replicator_private_ip }} || true
      changed_when: false

    - name: Display registration result
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} registered — group {{ mcast_group }}: {{ join_result.stdout }}"


# ── Play 4: Verify multicast datapath (source → m2u → replicator XDP) ──────────
# Inject a short probe burst from the source to the multicast group via udp_send
# and confirm the replicator XDP program redirected it — validates the m2u
# framing and the mcast.o filter end-to-end. Skipped when there
# is no source group (e.g. a replicator-only fleet).
- name: Verify multicast datapath
  hosts: replicator
  become: yes
  gather_facts: yes

  tasks:

    - name: Snapshot XDP redirect count (before probe)
      ansible.builtin.shell: |
        IFACE=$(ip -4 route show default | awk '{print $5}' | head -1)
        ethtool -S "$IFACE" | awk '/rx_xdp_redirect/{s+=$2} END{print s+0}'
      register: xdp_before
      changed_when: false
      run_once: true
      when: groups['source'] | default([]) | length > 0

    - name: Inject m2u probe from source (mcast_send, ~3s)
      ansible.builtin.shell: >
        IFACE=$(ip -4 route show default | awk '{print $5}' | head -1);
        timeout 3 /opt/af-xdp/mcast_send
        -I "$IFACE"
        -D {{ replicator_private_ip }}
        -g {{ mcast_group | default('224.0.31.50') }}
        -p {{ data_port | default(5000) }}
        -c 20 -i 1000 || true
      delegate_to: "{{ groups['source'][0] }}"
      changed_when: false
      run_once: true
      when: groups['source'] | default([]) | length > 0

    - name: Snapshot XDP redirect count (after probe)
      ansible.builtin.shell: |
        IFACE=$(ip -4 route show default | awk '{print $5}' | head -1)
        ethtool -S "$IFACE" | awk '/rx_xdp_redirect/{s+=$2} END{print s+0}'
      register: xdp_after
      changed_when: false
      run_once: true
      when: groups['source'] | default([]) | length > 0

    - name: Report multicast datapath probe result (best-effort)
      ansible.builtin.debug:
        msg: >-
          {{ 'Datapath probe OK — XDP redirected '
             ~ ((xdp_after.stdout | int) - (xdp_before.stdout | int)) ~ ' packet(s).'
             if (xdp_after.stdout | int) > (xdp_before.stdout | int)
             else 'Note: mcast_send probe saw no XDP redirects — check the replicator '
                  ~ 'config_map ({group,port}) and that mcast.o is attached. This is a '
                  ~ 'best-effort hint only; the authoritative datapath check is run_mcast.yaml.' }}
      run_once: true
      when: groups['source'] | default([]) | length > 0
